# .harness.yml — HALO 管理宣言 (コミット対象)。kind ごとに runtime とプロンプトを割り当てる
kinds:
  code:
    runtimes: [node-pnpm]
    prompt: .halo/prompts/code.md

# 自律度の上限 (ADR-0004)。profile / --autonomy より後に適用されるので、
# コマンドラインからは引き上げられない。HALO が HALO を保守する selfhost 運用では
# L2 を恒久の上限とする (PR 作成・外部公開は人間のゲートに残す)。
maxAutonomy: L2

# エージェントによる自己改変を禁じる追加パス (ADR-0004)。CLAUDE.md / PROMPT.md /
# .harness.yml / .claude/settings*.json は宣言不要で常に保護される。
# selfhost では「安全ゲート自身」を無人ループの手の届く場所に置かない:
# 監査ゲートの実装と、有効化されたプラグインの定義を保護対象に加える。
protectedPaths:
  - packages/plugins/src/gate-loop-audit/**
  - packages/plugins/src/lib/**
  - plugins/**/plugin.json
  - .github/workflows/**
