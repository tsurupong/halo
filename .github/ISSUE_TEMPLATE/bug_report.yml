name: Bug report
description: Something in HALO behaves differently from what the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md)
        for the private reporting channel.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command you ran and the smallest configuration that shows the problem.
      placeholder: |
        1. halo project init
        2. halo run nightly --dry-run
        3. ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >
        Your `.harness.yml`, the profile you ran, and which plugins are enabled
        (`ls .halo/ports/*.d`). Redact tokens and anything private.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        The relevant `.halo/logs/iter_N.json`, and `.halo/logs/current.json` if the loop
        hung. Redact anything sensitive.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: HALO version
      placeholder: '0.3.0 (npx halo --version)'
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: 'Node 22.11, pnpm 10.14.0, Ubuntu 24.04 / WSL2'
    validations:
      required: true
